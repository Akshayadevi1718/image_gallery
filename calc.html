<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Image Highlighter Gallery</title>
    <style>
        /* ==========================================
           PRO PALETTE: DEEP OBSIDIAN & NEON GLOWS
           ========================================== */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #06b6d4, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #9ca3af;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        /* ==========================================
           GALLERY GRID ARCHITECTURE
           ========================================== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            padding: 10px;
        }

        .gallery-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background-color: #111827;
            border: 2px solid #1f2937;
            cursor: pointer;
            aspect-ratio: 4 / 3;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            opacity: 0.6; /* Dim unselected images slightly */
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Crucial so event.target hits the wrapper div */
            transition: transform 0.4s ease;
        }

        /* Hover effect on items */
        .gallery-item:hover {
            opacity: 0.85;
            border-color: #374151;
            transform: translateY(-4px);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* ==========================================
           ACTIVE HIGHLIGHT STYLE (NEON CYAN BURST)
           ========================================== */
        .gallery-item.active {
            opacity: 1;
            border-color: #06b6d4;
            transform: scale(1.03) translateY(-4px);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.4), 
                        0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* ==========================================
           ANIMATIONS (FADE-IN TASK REQUIREMENT)
           ========================================== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>INTERACTIVE IMAGE HIGHLIGHTER</h1>
        <p>InternEzy Dashboard Task — Click an image to lock focus and reveal full exposure.</p>

        <div class="gallery-grid" id="image-gallery">
            
            <div class="gallery-item active">
                <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500&auto=format&fit=crop" alt="Abstract Neon 1">
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop" alt="Abstract Neon 2">
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=500&auto=format&fit=crop" alt="Abstract Neon 3">
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1604871000636-074fa5117945?w=500&auto=format&fit=crop" alt="Abstract Neon 4">
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=500&auto=format&fit=crop" alt="Abstract Neon 5">
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=500&auto=format&fit=crop" alt="Abstract Neon 6">
            </div>

        </div>
    </div>

    <script>
        // 1. Get the parent gallery container element
        const gallery = document.getElementById('image-gallery');

        // 2. Attach a single Event Listener to the parent container (Event Delegation pattern)
        gallery.addEventListener('click', function(event) {
            
            // 3. Use event.target to identify exactly which element was clicked
            const clickedElement = event.target;

            // Check if the clicked element is a gallery item card container
            if (clickedElement.classList.contains('gallery-item')) {
                
                // 4. Ensure only ONE active item at a time by finding and clearing the previous active item
                const currentActive = gallery.querySelector('.gallery-item.active');
                if (currentActive) {
                    currentActive.classList.remove('active');
                }

                // 5. Highlight the newly selected image item by adding the active class
                clickedElement.classList.add('active');
            }
        });
    </script>
</body>
</html>
