<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thalapathy Vijay Image Gallery</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            animation: initialFadePage 0.6s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #06b6d4, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #9ca3af;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 10px;
        }

        .gallery-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background-color: #111827;
            border: 2px solid #1f2937;
            cursor: pointer;
            aspect-ratio: 3 / 4;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            opacity: 0.4;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover {
            opacity: 0.7;
            border-color: #374151;
            transform: translateY(-4px);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item.active {
            opacity: 1;
            border-color: #06b6d4;
            transform: scale(1.03) translateY(-4px);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.4), 
                        0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .gallery-item.active img {
            animation: elementFadeIn 0.5s ease-out forwards;
        }

        @keyframes initialFadePage {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes elementFadeIn {
            from { 
                opacity: 0.3;
                filter: brightness(0.6) blur(4px);
            }
            to { 
                opacity: 1;
                filter: brightness(1) blur(0px);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>THALAPATHY VIJAY GALLERY</h1>
        <p>Click any frame to focus and activate the core layout engine.</p>

        <div class="gallery-grid" id="image-gallery">
            
            <div class="gallery-item active">
                <img src="one.jpeg" alt="Thalapathy Vijay 1">
            </div>

            <div class="gallery-item">
                <img src="two.jpeg" alt="Thalapathy Vijay 2">
            </div>

            <div class="gallery-item">
                <img src="three.jpeg" alt="Thalapathy Vijay 3">
            </div>

            <div class="gallery-item">
                <img src="four.jpeg" alt="Thalapathy Vijay 4">
            </div>

            <div class="gallery-item">
                <img src="five.jpeg" alt="Thalapathy Vijay 5">
            </div>

            <div class="gallery-item">
                <img src="six.jpeg" alt="Thalapathy Vijay 6">
            </div>

            <div class="gallery-item">
                <img src="seven.jpeg" alt="Thalapathy Vijay 7">
            </div>

            <div class="gallery-item">
                <img src="eight.jpeg" alt="Thalapathy Vijay 8">
            </div>

            <div class="gallery-item">
                <img src="nine.jpeg" alt="Thalapathy Vijay 9">
            </div>

        </div>
    </div>

    <script>
        const gallery = document.getElementById('image-gallery');

        gallery.addEventListener('click', function(event) {
            const clickedElement = event.target;

            if (clickedElement.classList.contains('gallery-item')) {
                const currentActive = gallery.querySelector('.gallery-item.active');
                
                if (currentActive) {
                    currentActive.classList.remove('active');
                    
                    const oldImg = currentActive.querySelector('img');
                    if (oldImg) {
                        oldImg.style.animation = 'none';
                        oldImg.offsetHeight; 
                        oldImg.style.animation = '';
                    }
                }

                clickedElement.classList.add('active');
            }
        });
    </script>
</body>
</html>
